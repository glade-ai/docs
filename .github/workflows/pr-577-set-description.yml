# Temporary: cursor[bot] cannot edit pull request bodies, and the agent
# description update preserves text that predates its marker. This job
# replaces PR 577's description once, then this file is removed.
name: Replace PR 577 description
on:
  pull_request:
jobs:
  replace-description:
    if: github.event.pull_request.number == 577
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Replace description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pr-body.md << 'EOF'
          <!-- CURSOR_AGENT_PR_BODY_BEGIN -->
          ## Why

          A client-pays firm with no Evergreen account (for example Washington Law Group) could never send a post-filing debtor education request. It failed with an integration error unless an earlier course on the case had already been bought. Sage checkout now uses the purchase link on the firm's Abacus account, and support should know that.

          ## Source PRs
          - glade-ai/noodle-api#9311: use the Abacus purchase URL for client-paid post-filing (Sage) checkout (DEV-45962)

          ## Files modified
          - `integrations/abacus-credit-counseling.md`

          <!-- changelog -->
          ### integrations/abacus-credit-counseling
          - Client-paid post-filing debtor education now works for firms without an Evergreen account. Sage checkout uses the firm's Abacus purchase link. If no link is set, the request is refused with a message asking the firm to configure one. (noodle-api#9311)
